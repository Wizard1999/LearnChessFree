<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A text-and-board chess school that tests what you can do when nobody tells you which idea to use." />
    <meta name="theme-color" content="#f4f1e9" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Scholarmate: a free chess school</title>
    <script>
      // Apply the saved appearance before first paint so a chosen theme never flashes. Storage can be unavailable: ignore errors.
      try { var a = JSON.parse(localStorage.getItem('cs-appearance') || '{}'); var r = document.documentElement;
        ['theme', 'board', 'text', 'motion', 'style'].forEach(function (k) { if (a[k] && a[k] !== 'system' && a[k] !== 'standard' && a[k] !== 'friendly') r.setAttribute('data-' + k, a[k]); }); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
