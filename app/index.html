<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A text-and-board chess school that tests what you can do when nobody tells you which idea to use." />
    <meta name="theme-color" content="#f4f1e9" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons-app/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Scholarmate" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="author" content="Andrew Valentine" />
    <title>Scholarmate: a free chess school</title>
    <script>
      // Apply the saved appearance before first paint so a chosen theme never flashes. Storage can be unavailable: ignore errors.
      try { var a = JSON.parse(localStorage.getItem('cs-appearance') || '{}'); var r = document.documentElement;
        // a device that never chose gets the default look, Atlas, and its board (keep in step with lib/appearance.ts)
        var st = a.style || 'atlas'; if (!a.style) a.style = st; if (!a.board && (st === 'atlas' || st === 'scholarmate')) a.board = st;
        ['theme', 'board', 'text', 'motion', 'style'].forEach(function (k) { if (a[k] && a[k] !== 'system' && a[k] !== 'standard') r.setAttribute('data-' + k, a[k]); });
        // Atlas and Scholarmate also set the browser-bar colour before paint: the header band, in both modes
        if (st === 'atlas' || st === 'scholarmate') { var m = document.createElement('meta'); m.name = 'theme-color'; m.setAttribute('data-live', ''); m.content = st === 'atlas' ? '#223b26' : '#123f42'; document.head.appendChild(m); } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
