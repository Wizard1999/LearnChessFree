name: Build and deploy to GitHub Pages

# The site is a static folder (app/dist). Content is built and verified locally with the Python tools and committed
# under app/public/content, so this workflow only installs, tests and bundles the app.
# It publishes nothing until Pages is enabled in the repository settings (Settings, Pages, Source: GitHub Actions).

# Manual only until Pages is enabled (otherwise every push would show a failed deploy). After enabling Pages,
# add back:  push: { branches: [main] }  under `on:` to deploy on every push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
